[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nbp-warehouse"
version = "0.1.0"
description = "Small warehouse on NBP exchange rates: API ingest to PostgreSQL"
requires-python = ">=3.10"
dependencies = [
    "requests",
    "psycopg[binary]",
    "python-dotenv",
]
